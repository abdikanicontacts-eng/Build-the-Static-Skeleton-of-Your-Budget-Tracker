<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <!-- Halkan ayaanu ku xirnay style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Qeybta 1aad: Madaxa Bogga -->
    <header class="main-header">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <!-- Add Expense Section -->
    <section id="add-expense-section">
        <h2>Add Expense</h2>
        <div class="form-group">
            <label for="expense-name">Expense Name:</label>
            <input type="text" id="expense-name" placeholder="e.g., Grocery, Rent">
        </div>

        <div class="form-group">
            <label for="expense-amount">Amount ($):</label>
            <input type="number" id="expense-amount" placeholder="e.g., 50">
        </div>

        <div class="form-group">
            <label for="expense-category">Category:</label>
            <input type="text" id="expense-category" placeholder="e.g., Food, Bills">
        </div>
    </section>

    <!-- Your Expenses Placeholder Section -->
    <section id="expenses-list-section">
        <h2>Your Expenses</h2>
        <p class="placeholder-text">No expenses yet</p>
    </section>

</body>
</html>
